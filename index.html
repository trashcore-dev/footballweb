<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Services</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #8000ff, #b266ff);
            position: relative;
            overflow-x: hidden;
        }

        /* Animated waves */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                rgba(0, 0, 0, 0.05),
                rgba(0, 0, 0, 0.05) 20px,
                transparent 20px,
                transparent 40px
            );
            animation: waveMove 15s linear infinite;
            z-index: -1;
        }

        @keyframes waveMove {
            0% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-50px) translateY(30px); }
            100% { transform: translateX(0) translateY(0); }
        }

        header {
            background-color: #4b0082;
            color: white;
            text-align: center;
            padding: 1rem 0;
            position: relative;
            z-index: 1;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .product-card {
            background-color: #000000; /* Black board */
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin: 1rem;
            width: 160px;
            text-align: center;
            padding: 0.8rem;
            color: white;
            animation: popRotate 1s ease-in-out infinite alternate;
        }

        /* Pop with slight rotation */
        @keyframes popRotate {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Staggered animation delays */
        .product-card:nth-child(1) { animation-delay: 0s; }
        .product-card:nth-child(2) { animation-delay: 0.3s; }
        .product-card:nth-child(3) { animation-delay: 0.6s; }
        .product-card:nth-child(4) { animation-delay: 0.9s; }
        .product-card:nth-child(5) { animation-delay: 1.2s; }

        .product-name { font-size: 1rem; margin: 0.5rem 0; }
        .product-price { color: #ff4d4d; font-weight: bold; font-size: 1.1rem; }

        .chat-button {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.5rem 1rem;
            color: white;
            font-size: 0.9rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }

        .pterodactyl-btn { background-color: #8000ff; }
        .pterodactyl-btn:hover { background-color: #5c00b3; }

        .whatsapp-btn { background-color: #25D366; }
        .whatsapp-btn:hover { background-color: #128C7E; }

        .website-btn { background-color: #007BFF; }
        .website-btn:hover { background-color: #0056b3; }

        .bot-btn { background-color: #ff6600; } /* Orange for Bot Creation */
        .bot-btn:hover { background-color: #cc5200; }

        .webcreation-btn { background-color: #00ccff; } /* Light blue for Website Creation */
        .webcreation-btn:hover { background-color: #0099cc; }

    </style>
</head>
<body>
    <header>
        <h1>Trashcore Premium Services</h1>
    </header>

    <div class="container">
        <div class="product-card">
            <div class="product-name">Pterodactyl Panels</div>
            <div class="product-price">from $1.00-$7.00</div>
            <a href="https://wa.me/254703726139?text=Hi!%20I'm%20interested%20in%20Pterodactyl%20Panels" target="_blank" class="chat-button pterodactyl-btn">Purchase</a>
        </div>

        <div class="product-card">
            <div class="product-name">Trashcore bug(service & script)</div>
            <div class="product-price">$3.00</div>
            <a href="https://wa.me/254703726139?text=Hi!%20I'm%20interested%20in%20Trashcore%20bug" target="_blank" class="chat-button whatsapp-btn">Purchase</a>
        </div>

        <div class="product-card">
            <div class="product-name">Website Codes</div>
            <div class="product-price">$10.00</div>
            <a href="https://wa.me/1234567890?text=Hi!%20I'm%20interested%20in%20Website%20Codes" target="_blank" class="chat-button website-btn">Purchase</a>
        </div>

        <div class="product-card">
            <div class="product-name">Bot Creation</div>
            <div class="product-price">$15.00</div>
            <a href="https://wa.me/254703726139?text=Hi!%20I'm%20interested%20in%20Bot%20Creation" target="_blank" class="chat-button bot-btn">Purchase</a>
        </div>

        <div class="product-card">
            <div class="product-name">Website Creation</div>
            <div class="product-price">$20.00</div>
            <a href="https://wa.me/254703726139?text=Hi!%20I'm%20interested%20in%20Website%20Creation" target="_blank" class="chat-button webcreation-btn">Purchase</a>
        </div>
    </div>
</body>
</html>
