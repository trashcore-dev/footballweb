<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products on Sale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #ff4d4d;
            color: white;
            text-align: center;
            padding: 1rem 0;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 2rem;
        }
        .product-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 1rem;
            width: 200px;
            text-align: center;
            padding: 1rem;
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: scale(1.05);
        }
        .product-card img {
            width: 100%;
            border-radius: 8px;
        }
        .product-name {
            font-size: 1.1rem;
            margin: 0.5rem 0;
        }
        .product-price {
            color: #ff4d4d;
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Products on Sale</h1>
    </header>

    <div class="container">
        <div class="product-card">
            <img src="https://via.placeholder.com/200x150" alt="Product 1">
            <div class="product-name">Product 1</div>
            <div class="product-price">$19.99</div>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/200x150" alt="Product 2">
            <div class="product-name">Product 2</div>
            <div class="product-price">$29.99</div>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/200x150" alt="Product 3">
            <div class="product-name">Product 3</div>
            <div class="product-price">$14.99</div>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/200x150" alt="Product 4">
            <div class="product-name">Product 4</div>
            <div class="product-price">$9.99</div>
        </div>
    </div>
</body>
</html>
